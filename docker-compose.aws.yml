# AWS production stack: Caddy (TLS) + API + worker + scheduler + Postgres + Redis.
# The dashboard lives on Cloudflare Pages and reaches this stack through the
# Cloudflare Worker at https://sunrise-api-proxy.devbulchandani876.workers.dev.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sunrise
      POSTGRES_PASSWORD: sunrise
      POSTGRES_DB: sunrise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunrise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sunrise:sunrise@postgres:5432/sunrise
      REDIS_URL: redis://redis:6379
      COGNITO_REGION: us-east-1
      COGNITO_USER_POOL_ID: us-east-1_V7pzjzvij
      COGNITO_APP_CLIENT_ID: 6l372ppaohfv233ojmgkhqf2k6
      COGNITO_DOMAIN: sunrise-trading-v7pzjzvij.auth.us-east-1.amazoncognito.com
      TRADING_ENABLED: "false"
    volumes:
      - ./.brightdata:/root/.config/brightdata-cli:ro
    # Only reachable from the host (SSM debugging) and the compose network.
    # Public traffic arrives through Caddy on 443.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sunrise:sunrise@postgres:5432/sunrise
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.brightdata:/root/.config/brightdata-cli:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.settings.WorkerSettings

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sunrise:sunrise@postgres:5432/sunrise
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.brightdata:/root/.config/brightdata-cli:ro
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.scheduler.main

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
