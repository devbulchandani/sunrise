# AWS free-tier variant: everything except the frontend container.
# Frontend lives on Cloudflare Pages; it talks to http://<ec2-ip>:8000/api
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sunrise
      POSTGRES_PASSWORD: sunrise
      POSTGRES_DB: sunrise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunrise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sunrise:sunrise@postgres:5432/sunrise
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sunrise:sunrise@postgres:5432/sunrise
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.settings.WorkerSettings

  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sunrise:sunrise@postgres:5432/sunrise
      REDIS_URL: redis://redis:6379
    depends_on:
      backend:
        condition: service_started
    command: python -m app.scheduler.main

volumes:
  pgdata:
